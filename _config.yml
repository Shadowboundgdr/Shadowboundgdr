# GitHub Pages Configuration

title: Shadowbound
description: Regolamento Dark Fantasy Open Source basato su D&D 5.2.1 SRD
theme: minima
url: https://alisio85.github.io/shadowbound
baseurl: /shadowbound

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude files from processing
exclude:
  - .github/
  - node_modules/
  - resources/
  - avventure/
  - .gitignore
  - LICENSE
  - README.md

# Social media
twitter_username: shadowbound_ttrpg
github_username: alisio85

# Navigation
nav:
  - title: Home
    url: /
  - title: Regolamento
    url: /sistema-gioco.html
  - title: Giocatori
    url: /manuale-giocatore.html
  - title: DM
    url: /manuale-dm.html
  - title: Community
    url: /community/
