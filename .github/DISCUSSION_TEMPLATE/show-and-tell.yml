title: "🎨 "
labels: ["🎨 Creazioni"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🎨 Show and Tell

        Condividi le tue creazioni! Personaggi, avventure, mappe, artefatti, illustrazioni...

  - type: textarea
    attributes:
      label: "🖼️ La tua creazione"
      description: "Mostra cosa hai creato! Link a immagini, file o documenti."
      placeholder: "Descrivi la tua creazione."
    validations:
      required: true

  - type: textarea
    attributes:
      label: "📝 Descrizione"
      description: "Racconta di cosa si tratta e come funziona."
      placeholder: "A cosa serve? Cosa lo rende speciale?"
    validations:
      required: true

  - type: textarea
    attributes:
      label: "💬 Feedback"
      description: "Che tipo di feedback cerchi?"
      placeholder: "Consigli, opinioni, suggerimenti?"
